services:
  financetrack:
    container_name: financetrack
    build: .
    ports:
      - "${HOST_PORT}:3000"
    env_file:
      - ./.env
    environment:
      - HOST=0.0.0.0
      - PORT=3000
    restart: unless-stopped
    networks:
      - biztrackkos-2_default

