version: '3.8'

services:
  web:
    build: .
    ports:
      - "${HOST_PORT}:3000"        # ← reads HOST_PORT from .env
    env_file:
      - ./.env                    # ← injects every variable into the container
    environment:                  # optional – you can override or add extra vars here
      - HOST=0.0.0.0              # make Next.js listen on all interfaces
      - PORT=3000                 # internal container port used by Next.js
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    restart: always
    env_file:
      - ./.env                    # same .env supplies POSTGRES_* vars
    ports:
      - "5433:5432"

