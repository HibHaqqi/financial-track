name: Auto Deploy to Production

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script_stop: true
        script: |
          set -e

          echo "=== Starting FinanceTrack Deployment ==="
          echo "Project Path: ${{ secrets.PROJECT_PATH || '/home/hibhaqqi/code/Financetrack' }}"

          # Navigate to project directory
          cd ${{ secrets.PROJECT_PATH || '/home/hibhaqqi/code/Financetrack' }}

          echo "Step 1: Pulling latest changes..."
          git fetch origin
          git reset --hard origin/master
          git pull origin master

          echo "Step 2: Stopping running containers..."
          docker compose down || true

          echo "Step 3: Starting database container..."
          docker compose up -d db

          echo "Step 4: Waiting for database to be ready..."
          sleep 10

          echo "Step 5: Running database migrations..."
          docker compose run --rm financetrack-web npx prisma db push

          echo "Step 6: Building and starting application..."
          docker compose up -d --build --force-recreate

          echo "Step 7: Waiting for application to be healthy..."
          sleep 15

          echo "Step 8: Checking container status..."
          docker compose ps

          echo "Step 9: Showing recent logs..."
          docker compose logs --tail=50 financetrack-web

          echo "=== Deployment Complete ==="
          echo "Application should be available at http://${{ secrets.APP_URL }}"
